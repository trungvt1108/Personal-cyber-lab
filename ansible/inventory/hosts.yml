all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    kali:
      hosts:
        LAB-KALI:
          ansible_connection: local
          lab_role: kali
    target:
      hosts:
        LAB-TARGET:
          ansible_host: "{{ lab_config.hosts.target.ip }}"
          lab_role: target
    monitor:
      hosts:
        LAB-MONITOR:
          ansible_host: "{{ lab_config.hosts.monitor.ip }}"
          lab_role: monitor
