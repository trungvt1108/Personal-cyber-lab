name: Defensive static checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install development tools
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Offline safety, parser and configuration tests
        run: python -m pytest
      - name: Python style
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: YAML, Markdown and publication source checks
        run: |
          python -m yamllint .
          python scripts/lint_markdown.py
          python scripts/check_repository.py
          python scripts/publication_audit.py
      - name: Shell lint
        run: shellcheck scripts/linux/*.sh scripts/simulations/*.sh scripts/monitoring/*.sh scripts/*.sh
      - name: Reproducible dashboard code and Compose syntax
        env:
          CYBERLAB_LOG_GID: '10000'
        run: |
          python scripts/build-dashboard.py
          git diff --exit-code -- dashboards/grafana/cyberlab.json
          CYBERLAB_GRAFANA_ROOT_URL="$(python -c '
          from cyberlab.config import load_config
          c = load_config()
          print("http://{}:{}/".format(c.hosts["monitor"].ip, c.services["grafana"]))
          ')"
          export CYBERLAB_GRAFANA_ROOT_URL
          docker compose -f docker/target/compose.yml config --quiet
          docker compose -f docker/monitoring/compose.yml config --quiet
      - name: Known Python dependency advisories
        run: python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps --progress-spinner off
      - name: Install pinned secret scanner from official release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cyberlab-gitleaks"
          cd "$RUNNER_TEMP/cyberlab-gitleaks"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
      - name: Redacted public working-tree and history secret scans
        shell: bash
        run: |
          "$RUNNER_TEMP/cyberlab-gitleaks/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
          "$RUNNER_TEMP/cyberlab-gitleaks/gitleaks" git . --config .gitleaks.toml --redact --no-banner
