/var/log/nginx/cyberlab-access.jsonl {
    daily
    maxsize 5M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        if systemctl is-active --quiet nginx; then
            systemctl kill -s USR1 nginx.service
        fi
    endscript
}
