/var/log/suricata/eve.json {
    daily
    maxsize 10M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    create 0640 suricata cyberlab-logs
    sharedscripts
    postrotate
        if systemctl is-active --quiet cyberlab-suricata; then
            systemctl kill -s HUP cyberlab-suricata.service
        fi
    endscript
}
/var/log/cyberlab-target/*.jsonl {
    daily
    maxsize 5M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    create 0640 syslog cyberlab-logs
    sharedscripts
    postrotate
        if systemctl is-active --quiet rsyslog; then
            systemctl kill -s HUP rsyslog.service
        fi
    endscript
}
